<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>360° Patient Care — Command Centre</title>
    <style>
      /* ---------- Splash screen (official, sketchy, on the pastel watercolour) ---------- */
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: linear-gradient(rgba(247,243,235,.60), rgba(242,237,228,.74)), url('/login-pastel.png') center/cover no-repeat #eef2ec;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        overflow: hidden;
        transition: opacity .55s ease, visibility .55s ease;
      }
      #splash.hide { opacity: 0; visibility: hidden; }
      #splash .sp-card { text-align: center; }
      /* hand-drawn ECG that draws itself */
      #splash .sp-ecg { width: 230px; height: 72px; display: block; margin: 0 auto 2px; }
      #splash .sp-ecg path { fill: none; stroke: #0f766e; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round;
        stroke-dasharray: 640; stroke-dashoffset: 640; animation: spdraw 2.8s ease-in-out infinite; filter: drop-shadow(0 1px 1px rgba(15,118,110,.2)); }
      @keyframes spdraw { 0% { stroke-dashoffset: 640; } 52% { stroke-dashoffset: 0; } 76% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -640; } }
      #splash .sp-title { font-size: 31px; font-weight: 800; color: #15423b; letter-spacing: -.5px; animation: sprise .7s .1s both; }
      #splash .sp-title b { color: #0f766e; }
      /* sketchy drawn underline */
      #splash .sp-uline { display: block; margin: 7px auto 0; width: 220px; }
      #splash .sp-uline path { fill: none; stroke: #0f9a86; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 240; stroke-dashoffset: 240; animation: spline 1s .55s ease-out forwards; }
      @keyframes spline { to { stroke-dashoffset: 0; } }
      #splash .sp-quote { margin-top: 20px; font-size: 16px; font-style: italic; color: #46564f; font-family: Georgia, 'Times New Roman', serif; animation: sprise 1s .65s both; }
      #splash .sp-sub { margin-top: 22px; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: #8a9b94; animation: sprise 1s .85s both; }
      #splash .sp-bar { margin: 16px auto 0; width: 180px; height: 3px; border-radius: 99px; background: rgba(15,118,110,.14); overflow: hidden; }
      #splash .sp-bar > i { display: block; height: 100%; width: 38%; border-radius: 99px; background: linear-gradient(90deg, transparent, #0f9a86, #14b89f, transparent); animation: spslide 1.3s ease-in-out infinite; }
      @keyframes spslide { 0% { transform: translateX(-130%); } 100% { transform: translateX(340%); } }
      @keyframes sprise { 0% { opacity: 0; transform: translateY(12px); } 100% { opacity: 1; transform: translateY(0); } }
      #splash .sp-by { position: absolute; bottom: 24px; color: #9aa89f; font-size: 11px; letter-spacing: .5px; }
      @media (prefers-reduced-motion: reduce) { #splash .sp-ecg path, #splash .sp-uline path, #splash .sp-bar > i { animation: none; stroke-dashoffset: 0; } }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="splash" role="status" aria-label="Loading 360 Patient Care">
      <div class="sp-card">
        <svg class="sp-ecg" viewBox="0 0 230 72" aria-hidden="true">
          <path d="M4,40 L58,40 L66,40 L72,22 L80,58 L88,12 L96,48 L104,40 L124,40 Q132,28 140,40 L156,40 L162,32 L168,40 L226,40" />
        </svg>
        <div class="sp-title">360° <b>Patient Care</b></div>
        <svg class="sp-uline" viewBox="0 0 220 10" aria-hidden="true"><path d="M6,6 Q58,2 110,5 T214,4" /></svg>
        <div class="sp-quote">“Where compassion meets coordination.”</div>
        <div class="sp-sub">Patient Care Management System</div>
        <div class="sp-bar"><i></i></div>
      </div>
      <div class="sp-by">Developed by pvalr</div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Fade the splash out once the app has mounted, keeping a graceful minimum on-screen time.
      (function () {
        var START = Date.now(), MIN = 1500;
        window.__hideSplash = function () {
          var el = document.getElementById('splash');
          if (!el) return;
          var wait = Math.max(0, MIN - (Date.now() - START));
          setTimeout(function () {
            el.classList.add('hide');
            setTimeout(function () { el && el.remove(); }, 650);
          }, wait);
        };
        // Fallback: never let the splash get stuck.
        setTimeout(function () { window.__hideSplash && window.__hideSplash(); }, 6000);
      })();
    </script>
  </body>
</html>
