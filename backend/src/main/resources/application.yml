server:
  port: 8080

spring:
  application:
    name: patient-care-backend
  datasource:
    url: jdbc:mysql://localhost:3306/pcare?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: pcare
    password: pcare_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
    show-sql: false
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

# Application-specific configuration
app:
  security:
    jwt:
      # Dev secret. Override via env APP_SECURITY_JWT_SECRET in production.
      secret: ${APP_SECURITY_JWT_SECRET:9b7d2f4a6c8e0f1a3b5d7f9012345678a1b2c3d4e5f60718293a4b5c6d7e8f90}
      access-token-minutes: 120
      refresh-token-days: 30
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
  seed:
    enabled: true
  storage:
    # Document uploads are written here (kept on D: where there is free space).
    uploads-dir: D:/floder/backend/uploads
  firebase:
    # Path to the Firebase service-account JSON for sending FCM push notifications.
    # Leave blank to disable push (notifications are still recorded). Override via env FIREBASE_CREDENTIALS.
    credentials-path: ${FIREBASE_CREDENTIALS:}

# Real-time SMS / OTP delivery via MSG91 (India). Leave blank to keep SMS DISABLED (OTPs are still
# generated & verified; the code is logged in dev). Set the env vars to deliver real SMS.
#   MSG91_AUTHKEY       — your MSG91 auth key
#   MSG91_OTP_TEMPLATE  — an approved DLT OTP template id (variable name = otp)
msg91:
  authkey: ${MSG91_AUTHKEY:}
  otp-template-id: ${MSG91_OTP_TEMPLATE:}
  var-name: ${MSG91_VAR_NAME:otp}
  country-code: ${MSG91_COUNTRY_CODE:91}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    org.springframework.security: INFO
    com.pcare: DEBUG
